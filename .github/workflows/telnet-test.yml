name: telnet-diagnostic
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 測試 bbs.ptt.cc:23 telnet 連通性
        run: |
          timeout 8 bash -c "echo > /dev/tcp/bbs.ptt.cc/23" && echo "TELNET_TCP_OK" || echo "TELNET_TCP_FAIL"
          curl -s -o /dev/null -w "web_still: %{http_code}\n" https://www.ptt.cc/bbs/sportlottery/index.html || echo "web_curl_error"
